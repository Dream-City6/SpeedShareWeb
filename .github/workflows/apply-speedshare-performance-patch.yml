name: Apply SpeedShare performance patch

on:
  push:
    branches:
      - feature/beta9-hardening
    paths:
      - .github/workflows/apply-speedshare-performance-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/beta9-hardening
          fetch-depth: 0
      - name: Apply exact source patch
        run: python tools/apply_speedshare_performance_patch.py
      - name: Commit patched server
        run: |
          if git diff --quiet -- app/src/main/java/com/alex/speedshare/SpeedShareServer.kt; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/alex/speedshare/SpeedShareServer.kt
          git commit -m "feat: apply SpeedShare user performance settings"
          git push origin HEAD:feature/beta9-hardening
