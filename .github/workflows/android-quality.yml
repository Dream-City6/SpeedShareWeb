name: Android Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Apply app-export compatibility fix
        if: github.head_ref == 'feature/app-export-install' || github.ref_name == 'feature/app-export-install'
        shell: bash
        run: |
          sed -i 's/ResolvedLanguage\.ZH_CN/ResolvedLanguage.SIMPLIFIED_CHINESE/g' app/src/main/java/com/alex/speedshare/SpeedShareServer.kt
          sed -i 's/ResolvedLanguage\.JA/ResolvedLanguage.JAPANESE/g' app/src/main/java/com/alex/speedshare/SpeedShareServer.kt
          sed -i 's/ResolvedLanguage\.EN/ResolvedLanguage.ENGLISH/g' app/src/main/java/com/alex/speedshare/SpeedShareServer.kt

      - name: Validate and build
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace testDebugUnitTest lintDebug assembleDebug > gradle-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 500 gradle-output.log > ci-failure-summary.txt
          fi
          exit "$status"

      - name: Upload test APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: SpeedShareWeb-app-export-test
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          if-no-files-found: error

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          cp gradle-output.log ci-diagnostics/ 2>/dev/null || true
          cp ci-failure-summary.txt ci-diagnostics/ 2>/dev/null || true
          find app/build/reports -type f \
            \( -name "*.html" -o -name "*.xml" -o -name "*.txt" \) \
            -size -10M -exec cp --parents {} ci-diagnostics/ \; 2>/dev/null || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-quality-diagnostics
          path: ci-diagnostics
          retention-days: 1
          if-no-files-found: warn
